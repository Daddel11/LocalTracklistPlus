name: Prototype verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify
        run: bash ./gradlew testDebugUnitTest lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ./gradlew :app:connectedDebugAndroidTest --console=plain
      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalTracklistPlus-prototype
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/
